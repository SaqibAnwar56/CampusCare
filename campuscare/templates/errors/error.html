{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="cc-card"><div class="empty py-5"><i class="bi bi-{{ 'shield-lock' if code == 403 else 'exclamation-circle' }}"></i>
<div class="t">Error {{ code }} — {{ title }}</div><div class="mb-3">{{ message }}</div>
<a class="btn btn-primary" href="{{ url_for('main.index') if current_user.is_authenticated else url_for('auth.login') }}">Back to home</a></div></div>
{% endblock %}
{% block auth %}
<div class="container py-5 text-center"><h1 class="display-4 fw-bold">{{ code }}</h1><h4>{{ title }}</h4><p class="text-muted">{{ message }}</p><a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to sign in</a></div>
{% endblock %}
